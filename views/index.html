<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App UI</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .filter-btn {
      background: #f4f4f4;
      border-radius: 20px;
      padding: 5px 15px;
      margin-right: 10px;
      border: none;
      cursor: pointer;
    }

    .filter-btn:hover {
      background: #e2e2e2;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container py-5">

    <!-- CREATE FORM -->
    <form id="todoForm">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" type="text" class="form-control" placeholder="Enter Todo Title" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="5" placeholder="Enter Todo Description" required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Purpose</label>
        <select name="purpose" class="form-select">
          <option>Home</option>
          <option>Office</option>
          <option>Personal</option>
          <option>Relationship</option>
          <option>Love</option>
        </select>
      </div>

      <div class="d-grid mb-4">
        <button class="btn btn-dark py-2" type="submit">Add Todo</button>
      </div>
    </form>

    <h3 class="fw-bold">Todo List</h3>

    <div id="todoList" class="mt-3"></div>

  </div>

  <!-- EDIT MODAL -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Edit Todo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">

            <div class="mb-3">
              <label>Title</label>
              <input id="editTitle" class="form-control" required>
            </div>

            <div class="mb-3">
              <label>Description</label>
              <textarea id="editDescription" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-3">
              <label>Purpose</label>
              <select id="editPurpose" class="form-select">
                <option>Home</option>
                <option>Office</option>
                <option>Personal</option>
                <option>Relationship</option>
                <option>Love</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Update</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const todoList = document.getElementById("todoList");
    const form = document.getElementById("todoForm");
    const editForm = document.getElementById("editForm");

    // Fetch & Display Todos
    async function loadTodos() {
      const res = await fetch("http://localhost:5000/todos");
      const todos = await res.json();

      todoList.innerHTML = todos.map(todo => `
        <div class="card p-3 mt-3">
          <h5>${todo.title}</h5>
          <p>${todo.description}</p>
          <span class="badge bg-secondary">${todo.purpose}</span>

          <div class="mt-3">
            <button class="btn btn-warning btn-sm" onclick="openEdit(${todo.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTodo(${todo.id})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    loadTodos();

    // CREATE Todo
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        title: form.title.value,
        description: form.description.value,
        purpose: form.purpose.value
      };

      await fetch("http://localhost:5000/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      form.reset();
      loadTodos();
    });

    // OPEN EDIT MODAL
    async function openEdit(id) {
      const res = await fetch("http://localhost:5000/todos");
      const todos = await res.json();
      const todo = todos.find(t => t.id == id);

      document.getElementById("editId").value = todo.id;
      document.getElementById("editTitle").value = todo.title;
      document.getElementById("editDescription").value = todo.description;
      document.getElementById("editPurpose").value = todo.purpose;

      const modal = new bootstrap.Modal(document.getElementById("editModal"));
      modal.show();
    }

    // UPDATE Todo
    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("editId").value;

      const updated = {
        title: document.getElementById("editTitle").value,
        description: document.getElementById("editDescription").value,
        purpose: document.getElementById("editPurpose").value
      };

      await fetch("http://localhost:5000/todos/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updated)
      });

      loadTodos();
      bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
    });

    // DELETE Todo
    async function deleteTodo(id) {
      await fetch("http://localhost:5000/todos/" + id, {
        method: "DELETE",
      });

      loadTodos();
    }
  </script>

</body>

</html>
